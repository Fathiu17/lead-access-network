# ---------------------------------------------------------------------------
# LEAD ACCESS Network — Netlify configuration
# ---------------------------------------------------------------------------

[build]
  command = "npx @11ty/eleventy"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# ---------------------------------------------------------------------------
# Redirects
# ---------------------------------------------------------------------------

# Serve the CMS at /admin (Sveltia / Pages CMS read /admin/config.yml)
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Optional: legacy category links -> posts listing
[[redirects]]
  from = "/category/:category"
  to = "/posts/?category=:category"
  status = 301

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
